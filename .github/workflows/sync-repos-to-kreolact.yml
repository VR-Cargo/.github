# Automatically sync VR-Cargo repos to kreolact
# - Creates missing repos in kreolact  
# - Adds mirror.yml workflow directly to repos (org admins bypass branch protection)
# Updated: 2026-02-02

name: Sync Repos to kreolact

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no changes)'
        required: false
        default: 'false'
        type: boolean

env:
  MIRROR_TEMPLATE: 

jobs:
  sync:
    name: Sync repositories
    runs-on: ubuntu-latest
    steps:
      - name: Sync repos to kreolact
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          MIRROR_TEMPLATE: ${{ env.MIRROR_TEMPLATE }}
        run: |
          echo "🔍 Checking VR-Cargo repos..."

          VR_CARGO_REPOS=$(gh repo list VR-Cargo --json name --jq '.[].name')

          CREATED_REPOS=""
          ADDED_WORKFLOWS=""
          SKIPPED_EMPTY=""

          for repo in $VR_CARGO_REPOS; do
            [ "$repo" = ".github" ] && continue

            echo ""
            echo "📦 Processing $repo"

            # Create kreolact repo if missing
            if ! gh repo view "kreolact/$repo" &>/dev/null; then
              echo "  ⚠️  kreolact/$repo does not exist"
              if [ "${{ inputs.dry_run }}" != "true" ]; then
                visibility=$(gh repo view "VR-Cargo/$repo" --json visibility --jq '.visibility' | tr '[:upper:]' '[:lower:]')
                description=$(gh repo view "VR-Cargo/$repo" --json description --jq '.description // empty')
                echo "  🔨 Creating kreolact/$repo..."
                if gh repo create "kreolact/$repo" --"$visibility" --description "Mirror of VR-Cargo/$repo${description:+ - $description}" 2>&1; then
                  CREATED_REPOS="$CREATED_REPOS\n  - kreolact/$repo"
                  echo "  ✅ Created"
                elif gh repo view "kreolact/$repo" &>/dev/null; then
                  # Race condition: repo exists now (GitHub API eventual consistency)
                  echo "  ✅ kreolact/$repo already exists (API lag)"
                else
                  echo "  ❌ Failed to create kreolact/$repo"
                  exit 1
                fi
              fi
            else
              echo "  ✅ kreolact/$repo exists"
            fi

            # Check if repo has content
            DEFAULT_BRANCH=$(gh repo view "VR-Cargo/$repo" --json defaultBranchRef --jq '.defaultBranchRef.name // empty')
            if [ -z "$DEFAULT_BRANCH" ]; then
              echo "  ⏭️ Empty repo - skipping"
              SKIPPED_EMPTY="$SKIPPED_EMPTY\n  - VR-Cargo/$repo"
              continue
            fi

            # Check if mirror workflow exists
            if ! gh api "repos/VR-Cargo/$repo/contents/.github/workflows/mirror.yml" &>/dev/null; then
              echo "  ⚠️  Missing mirror.yml"

              if [ "${{ inputs.dry_run }}" != "true" ]; then
                echo "  🔨 Adding mirror.yml directly..."

                # Decode template and replace placeholder
                CONTENT=$(echo "$MIRROR_TEMPLATE" | base64 -d | sed "s/REPO_PLACEHOLDER/$repo/g" | base64)

                # Create the workflow file directly on default branch (org admin bypass)
                if gh api "repos/VR-Cargo/$repo/contents/.github/workflows/mirror.yml" \
                  -X PUT \
                  -f message="feat: Add mirror workflow for kreolact sync" \
                  -f content="$CONTENT" \
                  -f branch="$DEFAULT_BRANCH" \
                  --silent 2>/dev/null; then
                  ADDED_WORKFLOWS="$ADDED_WORKFLOWS\n  - VR-Cargo/$repo"
                  echo "  ✅ Added mirror.yml"
                else
                  echo "  ❌ Failed to add mirror.yml (check PAT permissions)"
                fi
              fi
            fi
          done

          # .github repo
          echo ""
          echo "📦 Processing .github -> vr-cargo-github"
          if ! gh repo view "kreolact/vr-cargo-github" &>/dev/null; then
            if [ "${{ inputs.dry_run }}" != "true" ]; then
              if gh repo create "kreolact/vr-cargo-github" --private --description "Mirror of VR-Cargo/.github" 2>&1; then
                echo "  ✅ Created"
              elif gh repo view "kreolact/vr-cargo-github" &>/dev/null; then
                echo "  ✅ already exists (API lag)"
              else
                echo "  ❌ Failed to create"
                exit 1
              fi
            fi
          else
            echo "  ✅ exists"
          fi

          echo ""
          echo "========================================"
          echo "📊 SUMMARY"
          echo "========================================"
          [ -n "$CREATED_REPOS" ] && echo -e "\n✨ Created kreolact repos:$CREATED_REPOS"
          [ -n "$ADDED_WORKFLOWS" ] && echo -e "\n✨ Added mirror.yml to:$ADDED_WORKFLOWS"
          [ -n "$SKIPPED_EMPTY" ] && echo -e "\n⏭️ Skipped empty repos:$SKIPPED_EMPTY"
          [ -z "$CREATED_REPOS$ADDED_WORKFLOWS$SKIPPED_EMPTY" ] && echo -e "\n✅ All repos synced and have mirror workflows!"

          echo ""
          echo "Sync complete!"
